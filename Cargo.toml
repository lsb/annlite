[workspace]
resolver = "2"
members = [
    "crates/annlite-core",
    "crates/annlite-corpus",
    "crates/annlite-fts5",
    "crates/annlite-netsim",
    "crates/annlite-sqlite",
    "crates/annlite-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lsb/annlite"

[workspace.dependencies]
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
