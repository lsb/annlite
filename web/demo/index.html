<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>annlite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232f6f4e'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a18; --muted: #6b6b66; --line: #e2e2dd;
    --accent: #2f6f4e; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a; --fg: #e9e9e6; --muted: #9a9a94; --line: #2c2e33;
      --accent: #7fc9a2; --card: #1d1f23;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --fg: #e9e9e6; --muted: #9a9a94; --line: #2c2e33;
    --accent: #7fc9a2; --card: #1d1f23;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text], select {
    width: 100%; padding: 9px 11px; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1 1 120px; }
  button {
    font: inherit; padding: 9px 18px; border-radius: 7px; cursor: pointer;
    background: var(--accent); color: var(--bg); border: 0; font-weight: 600;
  }
  button[disabled] { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .cost {
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent); margin-top: 12px; word-break: break-word;
  }
  ol { list-style: none; padding: 0; margin: 0; }
  ol li {
    display: grid; grid-template-columns: 28px 62px 1fr; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline;
  }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .did { font: 12px ui-monospace, Menlo, monospace; color: var(--accent); }
  .body { color: var(--fg); font-size: 13.5px; word-break: break-word; }
  .err { color: #c0392b; display: block; }
  pre#log {
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
    white-space: pre-wrap; margin: 0; max-height: 160px; overflow: auto;
  }
  .stats { color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) { ol li { grid-template-columns: 24px 1fr; } .did { grid-column: 2; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>annlite</h1>
  <p class="sub">
    Vector search over a SQLite file fetched by HTTP range requests. This page holds
    no copy of the database &mdash; every byte below arrived over the network.
  </p>

  <div class="card">
    <label for="q">Query</label>
    <input id="q" type="text" value="guitar music concert stage" autocomplete="off">
    <div class="row" style="margin-top:12px">
      <div>
        <label for="l">Search list (L)</label>
        <select id="l"><option>32</option><option selected>64</option><option>128</option></select>
      </div>
      <div>
        <label for="beam">Beam width</label>
        <select id="beam"><option>1</option><option selected>4</option><option>16</option></select>
      </div>
      <div>
        <label for="rerank">Exact rerank</label>
        <div><input id="rerank" type="checkbox" checked> <span class="stats">top 50</span></div>
      </div>
      <div style="flex:0 0 auto"><button id="go" disabled>Search</button></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div style="flex:0 0 auto">
        <button id="resident" class="ghost" disabled>Preload PQ codes</button>
      </div>
      <div>
        <label for="transport">Transport</label>
        <select id="transport">
          <option value="range" selected>bounded Range requests</option>
          <option value="sqlite">SQLite over httpvfs</option>
        </select>
      </div>
      <div class="stats">codes: <span id="mode">on-disk</span></div>
    </div>
    <div class="cost" id="cost"></div>
  </div>

  <div class="card">
    <div class="stats" id="stats">loading&hellip;</div>
    <ol id="results"></ol>
  </div>

  <div class="card"><pre id="log"></pre></div>
</div>
<script src="./vendor/index.js"></script>
<script src="./queries.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
