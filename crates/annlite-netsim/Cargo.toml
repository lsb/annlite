[package]
name = "annlite-netsim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP byte-range server with configurable latency and throughput simulation"

[lib]
name = "annlite_netsim"
path = "src/lib.rs"

[[bin]]
name = "annlite-netsim"
path = "src/main.rs"

[dependencies]
