[package]
name = "annlite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser bindings for annlite: tokenization, PQ scoring and graph traversal in WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
annlite-core = { path = "../annlite-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

# `annlite-core` pulls in `rand` for index construction, which reaches `getrandom`.
# On wasm32-unknown-unknown that crate has no default backend and fails to compile,
# so the browser build is told to use the JS one. Nothing in the query path draws
# random numbers; this only satisfies the link.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
